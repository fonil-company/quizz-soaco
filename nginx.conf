# Template: ${CRM_WEBHOOK_URL} e ${CRM_UMBRELLA_WEBHOOK_URL} são preenchidos pela variável de ambiente ao subir o container.

# Limite de envios de lead por IP (anti-spam)
limit_req_zone $binary_remote_addr zone=leads:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=leads_umbrella:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=leads_sheets:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=meta:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # IP real do visitante atrás do proxy do Easypanel (Traefik)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Lead do quiz -> webhook do Fonil CRM (token só existe no servidor)
    location = /api/lead {
        limit_except POST { deny all; }
        limit_req zone=leads burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        resolver 127.0.0.11 1.1.1.1 valid=60s ipv6=off;
        resolver_timeout 5s;
        set $crm_url "${CRM_WEBHOOK_URL}";
        proxy_pass $crm_url;
        proxy_ssl_server_name on;
        proxy_set_header Content-Type "application/json";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    # Lead do quiz -> webhook do Umbrella CRM (a API deles não libera CORS para o navegador)
    location = /api/lead-umbrella {
        limit_except POST { deny all; }
        limit_req zone=leads_umbrella burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        resolver 127.0.0.11 1.1.1.1 valid=60s ipv6=off;
        resolver_timeout 5s;
        set $umbrella_url "${CRM_UMBRELLA_WEBHOOK_URL}";
        proxy_pass $umbrella_url;
        proxy_ssl_server_name on;
        proxy_set_header Content-Type "application/json";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    # Lead do quiz -> planilha do Google Sheets (Apps Script publicado como app da Web)
    location = /api/lead-sheets {
        limit_except POST { deny all; }
        limit_req zone=leads_sheets burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        resolver 127.0.0.11 1.1.1.1 valid=60s ipv6=off;
        resolver_timeout 5s;
        set $sheets_url "${SHEETS_WEBHOOK_URL}";
        # Sem URL configurada no Easypanel, ignora sem erro
        if ($sheets_url = "") { return 204; }
        proxy_pass $sheets_url;
        proxy_ssl_server_name on;
        proxy_set_header Content-Type "application/json";
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        # O Apps Script grava a linha e responde com redirect (302) para script.googleusercontent.com;
        # o redirect não é repassado ao navegador, que recebe só a confirmação.
        proxy_intercept_errors on;
        error_page 301 302 303 = @sheets_ok;
        add_header Cache-Control "no-store" always;
    }

    location @sheets_ok {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"ok":true}';
    }

    # Meta Conversions API -> graph.facebook.com (o token só existe no servidor)
    location = /api/meta-event {
        limit_except POST { deny all; }
        limit_req zone=meta burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        resolver 127.0.0.11 1.1.1.1 valid=60s ipv6=off;
        resolver_timeout 5s;
        set $meta_url "https://graph.facebook.com/${META_GRAPH_VERSION}/${META_PIXEL_ID}/events?access_token=${META_CAPI_TOKEN}";
        proxy_pass $meta_url;
        proxy_ssl_server_name on;
        proxy_set_header Content-Type "application/json";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    # Fontes: cache de 1 ano (se trocar a fonte, troque também o nome do arquivo)
    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(webp|png|jpe?g|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
