<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Só Aço | Descubra a estrutura ideal para o seu armazém</title>
<meta name="description" content="Responda 6 perguntas rápidas e descubra qual estrutura em aço é a ideal para o seu armazém, galpão ou depósito.">
<meta name="theme-color" content="#051D59">
<link rel="icon" href="assets/logo-so-aco.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #051D59;
    --navy-deep: #031B4D;
    --navy-mid: #061D61;
    --gold: #F8AC1A;
    --gold-hover: #FFBC3A;
    --white: #FFFFFF;
    --steel: #A7AFBA;
    --light: #F3F5F8;
    --line: rgba(167, 175, 186, .18);
    --card: rgba(255, 255, 255, .04);
    --card-hover: rgba(248, 172, 26, .08);
    --radius: 10px;
    --font-title: "Michroma", "Eurostile Extended", "Arial Black", sans-serif;
    --font-body: "Montserrat", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: var(--font-body);
    color: var(--white);
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(6, 29, 140, .55), transparent 60%),
      linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 55%, var(--navy-mid) 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* Malha modular, como uma estrutura de porta-pallet vista de frente */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 120px 80px;
    mask-image: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,.35), transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,.35), transparent 75%);
  }
  [hidden] { display: none !important; }
  img { max-width: 100%; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .wrap {
    position: relative;
    max-width: 760px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Topo ---------- */
  .top {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-block: 8px 20px;
  }
  .top .badge {
    width: 52px;
    height: 52px;
    border-radius: 10px;
    overflow: hidden;
    flex: none;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08);
  }
  .progress {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--steel);
  }
  .progress-meta b { color: var(--gold); font-weight: 700; }
  .bar {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
  }
  .bar span {
    height: 6px;
    border-radius: 2px;
    background: rgba(255,255,255,.12);
    transition: background .3s ease;
  }
  .bar span.on { background: var(--gold); }

  .btn-back {
    background: none;
    border: 0;
    padding: 8px 0;
    color: var(--steel);
    font-size: 14px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    align-self: flex-start;
  }
  .btn-back:hover { color: var(--white); }

  /* ---------- Telas ---------- */
  main { flex: 1; display: flex; flex-direction: column; }
  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    animation: enter .45s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes enter {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .eyebrow::before {
    content: "";
    width: 28px;
    height: 3px;
    border-radius: 2px;
    background: var(--gold);
  }

  h1, h2 {
    font-family: var(--font-title);
    font-weight: 400;
    text-transform: uppercase;
    line-height: 1.25;
    letter-spacing: .01em;
    margin: 0;
  }
  h1 { font-size: clamp(24px, 5.4vw, 38px); }
  h2 { font-size: clamp(19px, 4vw, 26px); }
  h1 em, h2 em { font-style: normal; color: var(--gold); }

  .lead {
    font-size: clamp(15px, 2.4vw, 17px);
    line-height: 1.6;
    color: rgba(255,255,255,.82);
    margin: 0;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 0;
    border-radius: 8px;
    background: var(--gold);
    color: var(--navy);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 18px 28px;
    min-height: 56px;
    text-decoration: none;
    transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    box-shadow: 0 10px 30px -10px rgba(248,172,26,.55);
  }
  .btn:hover { background: var(--gold-hover); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn svg { width: 20px; height: 20px; flex: none; }

  /* ---------- Intro ---------- */
  .intro {
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 28px;
    padding-block: 24px;
  }
  .intro .logo {
    width: 128px;
    height: 128px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 24px 60px -20px rgba(0,0,0,.6);
  }
  .intro h1 { max-width: 640px; }
  .intro .lead { max-width: 520px; }
  .facts {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 22px;
    font-size: 13px;
    font-weight: 600;
    color: var(--steel);
  }
  .facts span { display: inline-flex; align-items: center; gap: 8px; }
  .facts svg { width: 16px; height: 16px; color: var(--gold); }
  .intro .btn { width: min(100%, 360px); }
  .rack {
    width: min(100%, 520px);
    height: auto;
    opacity: .9;
  }

  /* ---------- Perguntas ---------- */
  .question { gap: 22px; padding-top: 8px; }
  .question .hint { font-size: 14px; color: var(--steel); margin: -10px 0 0; }
  .options {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  .option {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    padding: 18px 16px;
    min-height: 84px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1.5px solid rgba(255,255,255,.12);
    transition: border-color .2s ease, background .2s ease, transform .2s ease;
  }
  .option:hover { border-color: rgba(248,172,26,.6); background: var(--card-hover); }
  .option.selected { border-color: var(--gold); background: rgba(248,172,26,.14); }
  .option .ico {
    width: 46px;
    height: 46px;
    flex: none;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: rgba(248,172,26,.12);
    color: var(--gold);
  }
  .option .ico svg { width: 26px; height: 26px; }
  .option .txt { display: flex; flex-direction: column; gap: 3px; }
  .option .t { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .option .d { font-size: 13px; color: var(--steel); line-height: 1.4; }
  .option .check {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.25);
    display: grid;
    place-items: center;
    transition: all .2s ease;
  }
  .option.selected .check { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  .option .check svg { width: 12px; height: 12px; opacity: 0; }
  .option.selected .check svg { opacity: 1; }

  /* ---------- Formulário ---------- */
  .form-screen { gap: 22px; padding-top: 8px; }
  form { display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--steel);
  }
  .field input {
    font: inherit;
    font-size: 16px;
    color: var(--navy);
    background: var(--white);
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 15px 16px;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(248,172,26,.25); }
  .field.invalid input { border-color: #FF6B5B; }
  .field .err { font-size: 12px; color: #FF9A8F; font-weight: 600; min-height: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .privacy {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-size: 12px;
    color: var(--steel);
    line-height: 1.5;
  }
  .privacy svg { width: 16px; height: 16px; flex: none; color: var(--gold); margin-top: 1px; }
  form .btn { margin-top: 6px; }

  /* ---------- Carregando ---------- */
  .loading {
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 24px;
  }
  .loader {
    display: grid;
    grid-template-columns: repeat(3, 18px);
    gap: 6px;
  }
  .loader span {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    background: var(--gold);
    animation: stack 1s ease-in-out infinite;
  }
  .loader span:nth-child(2) { animation-delay: .15s; }
  .loader span:nth-child(3) { animation-delay: .3s; }
  @keyframes stack {
    0%, 100% { opacity: .25; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-8px); }
  }
  .loading p { color: var(--steel); font-weight: 600; margin: 0; }

  /* ---------- Resultado ---------- */
  .result { gap: 22px; padding-top: 8px; }
  .result-card {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: var(--white);
    color: var(--navy);
  }
  .result-head {
    background: var(--navy-deep);
    color: var(--white);
    padding: 26px 24px 22px;
    border-bottom: 4px solid var(--gold);
    display: flex;
    gap: 18px;
    align-items: center;
  }
  .result-head .ico {
    width: 64px;
    height: 64px;
    flex: none;
    border-radius: 10px;
    background: var(--gold);
    color: var(--navy);
    display: grid;
    place-items: center;
  }
  .result-head .ico svg { width: 38px; height: 38px; }
  .result-head small {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .result-head h2 { font-size: clamp(17px, 3.6vw, 22px); }
  .result-body { padding: 22px 24px 26px; display: flex; flex-direction: column; gap: 18px; }
  .result-body p { margin: 0; font-size: 15px; line-height: 1.6; color: #24345E; }
  .benefits { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .benefits li {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.45;
  }
  .benefits li::before {
    content: "";
    width: 10px;
    height: 10px;
    margin-top: 5px;
    flex: none;
    border-radius: 2px;
    background: var(--gold);
  }
  .summary {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .summary div {
    background: var(--light);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .summary dt {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #6A7487;
  }
  .summary dd { margin: 3px 0 0; font-size: 13px; font-weight: 700; }
  .also {
    font-size: 13px;
    color: var(--steel);
    text-align: center;
    margin: 0;
  }
  .also b { color: var(--white); }
  .result .btn { width: 100%; }
  .restart {
    align-self: center;
    background: none;
    border: 0;
    color: var(--steel);
    font-size: 13px;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 6px;
  }
  .restart:hover { color: var(--white); }

  footer {
    text-align: center;
    font-size: 12px;
    color: rgba(167,175,186,.7);
    padding-top: 28px;
    letter-spacing: .04em;
  }

  @media (max-width: 560px) {
    .options { grid-template-columns: 1fr; }
    .option { min-height: 72px; padding: 14px; }
    .row { grid-template-columns: 1fr; }
    .summary { grid-template-columns: 1fr; }
    .result-head { padding: 22px 18px 18px; }
    .result-body { padding: 20px 18px 22px; }
    .top .badge { width: 44px; height: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function setProgress(i) {
  const total = QUESTIONS.length;
  const done = Math.min(i, total);
  [...bar.children].forEach((s, n) => s.classList.toggle("on", n < done + (i < total ? 1 : 0)));
  document.getElementById("stepLabel").innerHTML = i < total
    ? `Pergunta <b>${i + 1}</b> de ${total}`
    : `<b>Quase lá</b>`;
  document.getElementById("stepPct").textContent = Math.round((done / total) * 100) + "%";
}

function go(step) {
  clearTimeout(advanceTimer);
  state.step = step;
  window.scrollTo({ top: 0, behavior: "smooth" });
  if (step < 0) return renderIntro();
  if (step < QUESTIONS.length) return renderQuestion(step);
  if (step === QUESTIONS.length) return renderForm();
  renderResult();
}

            <span class="ico">${I[o.icon]}</span>
            <span class="txt"><span class="t">${esc(o.t)}</span><span class="d">${esc(o.d)}</span></span>
            <span class="check">${I.check}</span>
          </button>`).join("")}
      </div>

  document.getElementById("back").onclick = () => go(i - 1);

      app.querySelectorAll(".option").forEach(b => { b.classList.remove("selected"); b.setAttribute("aria-checked", "false"); });

      btn.setAttribute("aria-checked", "true");
      state.answers[i] = Number(btn.dataset.n);
      clearTimeout(advanceTimer);
      advanceTimer = setTimeout(() => go(i + 1), 320);

function maskPhone(v) {
  const d = v.replace(/\D/g, "").slice(0, 11);
  if (d.length <= 2) return d.length ? `(${d}` : "";
  if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
}

function showLoading() {
  topBar.hidden = true;
  app.innerHTML = `
    <section class="screen loading">
      <div class="loader"><span></span><span></span><span></span></div>
      <h2>Analisando sua <em>operação</em></h2>
      <p>Cruzando carga, peso e espaço disponível…</p>
    </section>`;
  const result = computeResult();
  sendLead(result);
  setTimeout(() => go(QUESTIONS.length + 1), 1600);
}

function computeResult() {
  const score = { SEL: 0, DRV: 0, CAN: 0, MEZ: 0, EST: 0 };
  state.answers.forEach((a, i) => {
    const p = QUESTIONS[i].options[a].p;
    for (const k in p) score[k] += p[k];
  });
  const ranked = Object.keys(score).sort((a, b) => score[b] - score[a]);
  return { main: ranked[0], second: ranked[1], score };
}

function answerSummary() {
  return QUESTIONS.map((q, i) => ({ label: q.label, value: q.options[state.answers[i]].t }));
}

function leadTemperature() {
  return ["Quente", "Morno", "Morno", "Frio"][state.answers[QUESTIONS.length - 1]];
}

function sendLead(result) {
  if (!CONFIG.webhook) return;
  const payload = {
    ...state.lead,
    solucao: SOLUTIONS[result.main].name,
    solucao_alternativa: SOLUTIONS[result.second].name,
    temperatura: leadTemperature(),
    respostas: Object.fromEntries(answerSummary().map(r => [r.label, r.value])),
    pagina: location.href,
    data: new Date().toISOString()
  };
  fetch(CONFIG.webhook, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
    keepalive: true
  }).catch(() => {});
}

    <section class="screen result">
      <span class="eyebrow">Resultado do diagnóstico</span>
      <h2>${esc(firstName)}, esta é a <em>solução ideal</em> para você</h2>
      <article class="result-card">
        <div class="result-head">
          <div class="ico">${I[s.icon]}</div>
          <div><small>Recomendação Só Aço</small><h2>${esc(s.name)}</h2></div>
        </div>
        <div class="result-body">
          <p>${esc(s.text)}</p>
          <ul class="benefits">${s.benefits.map(b => `<li>${esc(b)}</li>`).join("")}</ul>
          <dl class="summary">
            ${summary.slice(0, 4).map(x => `<div><dt>${esc(x.label)}</dt><dd>${esc(x.value)}</dd></div>`).join("")}
          </dl>
        </div>
      </article>
      <p class="also">Também pode combinar com a sua operação: <b>${esc(alt.name)}</b></p>
      <a class="btn" href="${waUrl}" target="_blank" rel="noopener">${I.wa} Falar com um especialista</a>
      <button class="restart" id="restart">Refazer o quiz</button>
    </section>`;
  document.getElementById("restart").onclick = () => {
    state.answers = [];
    go(-1);
  };
}

go(-1);
</script>
</body>
</html>
